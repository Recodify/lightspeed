project: default

clickhouse:
  host: localhost
  port: 8123
  user: default
  password: "default"
  database: benchmark
  connection_pool_size: 10
  timeout_seconds: 300

schema:
  fail_on_error: true
  fresh: true

workload:
  name: mixed_workload
  path: baseline
  # Blend simple, aggregate, and parameterized queries
  queries:
    - file: q01_simple.sql
      weight: 2
    - file: q02_aggregate.sql
      weight: 1
    - file: q03_parameterized.sql
      weight: 1
  parameters:
    event_type:
      type: random_choice
      values:
        - login
        - logout
        - click
        - purchase
        - view
  concurrency: 6
  duration_seconds: 20
  ramp_up_seconds: 2
  warmup_queries: 15
  think_time_ms: 5
  max_errors: 100
  query_timeout_seconds: 60

metrics:
  use_query_log: true
  query_log_wait_seconds: 10
  output_csv: results/mixed_results.csv
  output_md: results/mixed_results.md

variants:
  default:
    description: "Time-oriented ordering to optimize range filters"
    data:
      load_method: insert
      truncate_before_load: true
      load:
        - table: events
          file: sample.csv
          format: CSVWithNames

  variant1:
    description: "User-oriented ordering to optimize user lookups"
    data:
      load_method: insert
      truncate_before_load: true
      load:
        - table: events
          file: sample.csv
          format: CSVWithNames
