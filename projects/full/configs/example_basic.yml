project: default

# Project-level defaults (shared across all variants)
clickhouse:
  host: localhost
  port: 8123
  user: default
  password: "default"
  database: benchmark
  connection_pool_size: 10
  timeout_seconds: 300

schema:
  fail_on_error: true
  fresh: true

workload:
  name: basic_benchmark
  path: baseline
  # Explicitly list queries (exclude q03_parameterized.sql which requires parameters)
  queries:
    - file: q01_simple.sql
      weight: 1
    - file: q02_aggregate.sql
      weight: 1
  concurrency: 4
  duration_seconds: 10
  ramp_up_seconds: 0
  warmup_queries: 10
  think_time_ms: 0
  max_errors: 100
  query_timeout_seconds: 60

metrics:
  use_query_log: true
  query_log_wait_seconds: 5
  # Output paths will automatically include variant name: results/results_{variant}.csv
  output_csv: results/results.csv
  output_md: results/results.md

# Define variants with different data configurations
variants:
  default:
    description: "Baseline configuration with sample data"
    data:
      load_method: insert
      truncate_before_load: false
      load:
        - table: events
          file: sample.csv
          format: CSVWithNames

  variant1:
    description: "Variant 1 configuration (same as default for now)"
    data:
      load_method: insert
      truncate_before_load: false
      load:
        - table: events
          file: sample.csv
          format: CSVWithNames
